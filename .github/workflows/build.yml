name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run checks
        shell: pwsh
        run: .\gradlew.bat clean check --stacktrace

  release-verification:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install and locate Blender 5.1+
        id: blender
        shell: pwsh
        run: |
          choco install blender --yes --no-progress
          $candidates = @(
            (Get-Command blender.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source),
            (Get-ChildItem -LiteralPath 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -ExpandProperty FullName)
          ) | Where-Object { $_ } | Select-Object -Unique
          $blender = $candidates | Select-Object -First 1
          if (-not $blender) {
            throw 'Blender executable was not found after installation.'
          }
          $versionLine = (& $blender --version | Select-Object -First 1)
          if ($versionLine -notmatch '^Blender\s+(\d+\.\d+(?:\.\d+)?)') {
            throw "Unable to parse Blender version from: $versionLine"
          }
          $version = [version]$Matches[1]
          if ($version -lt [version]'5.1.0') {
            throw "BlendLib release verification requires Blender 5.1+, found $version at $blender"
          }
          "path=$blender" >> $env:GITHUB_OUTPUT
          Write-Host "Using Blender $version at $blender"

      - name: Build and verify release artifacts
        shell: pwsh
        run: .\gradlew.bat clean check buildRelease "-Pblender_executable=${{ steps.blender.outputs.path }}" --stacktrace

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blendlib-public-alpha-${{ github.ref_name }}
          path: build/release/
          if-no-files-found: error
