name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run checks
        shell: pwsh
        run: .\gradlew.bat clean check --stacktrace

  release-verification:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install and locate Blender 5.1+
        id: blender
        shell: pwsh
        run: |
          choco install blender --yes --no-progress
          $candidates = @(
            (Get-Command blender.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source),
            (Get-ChildItem -LiteralPath 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -ExpandProperty FullName)
          ) | Where-Object { $_ } | Select-Object -Unique
          $blender = $candidates | Select-Object -First 1
          if (-not $blender) {
            throw 'Blender executable was not found after installation.'
          }
          $versionLine = (& $blender --version | Select-Object -First 1)
          if ($versionLine -notmatch '^Blender\s+(\d+\.\d+(?:\.\d+)?)') {
            throw "Unable to parse Blender version from: $versionLine"
          }
          $version = [version]$Matches[1]
          if ($version -lt [version]'5.1.0') {
            throw "BlendLib release verification requires Blender 5.1+, found $version at $blender"
          }
          "path=$blender" >> $env:GITHUB_OUTPUT
          Write-Host "Using Blender $version at $blender"

      - name: Build and verify release artifacts
        shell: pwsh
        run: .\gradlew.bat clean check buildRelease "-Pblender_executable=${{ steps.blender.outputs.path }}" --stacktrace

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blendlib-public-alpha-${{ github.ref_name }}
          path: build/release/
          if-no-files-found: error

  blender-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check strict authoring compiler
        run: python -B -m unittest discover -s blender-addon/tests -v
      - name: Install verified official Blender 5.1.2
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo 'aaccb355f50183979b698bcce7467103a76261b5fa59f4972295842662a285fb  '"$RUNNER_TEMP/blender.tar.xz" | sha256sum --check --strict
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.1.2-linux-x64" >> "$GITHUB_PATH"
      - name: Verify genuine exporter, saved Text and legacy regressions
        run: |
          blender --version
          blender --background --python-exit-code 1 --python blender-addon/scripts/verify_runtime_authoring.py -- --project-root .
          blender --background --python-exit-code 1 --python blender-addon/scripts/export_blendlib.py -- --blend test-assets/blender-authoring/source.blend --project-root build/authoring-cli-reopen --namespace blendlib_authoring --model-id actor --profile blendlib:rigid_v1 --collection BlendLibExport --runtime-authoring-text BlendLib.runtime.json --report report.json
          blender --background --python-exit-code 1 --python blender-addon/scripts/verify_authoring_editor.py -- --project-root .
          git diff --exit-code -- test-assets/blender-authoring/exported
          blender --background --python-exit-code 1 --python blender-addon/scripts/verify_socket_editor.py -- --project-root .
          git diff --exit-code -- test-assets/blender-sockets/exported
          blender --background --python-exit-code 1 --python blender-addon/scripts/verify_socket_discovery_state.py -- --project-root .
          blender --background --python-exit-code 1 --python blender-addon/scripts/verify_rules_editor.py -- --project-root .
          git diff --exit-code -- test-assets/blender-rules/exported
          blender --background --python-exit-code 1 --python blender-addon/scripts/verify_transition_editor.py -- --project-root .
          git diff --exit-code -- test-assets/blender-transitions/exported
          blender --background --python-exit-code 1 --python blender-addon/scripts/verify_p2_fixtures.py -- --project-root .
          blender --background --python-exit-code 1 --python blender-addon/scripts/verify_x5_toolchain.py
