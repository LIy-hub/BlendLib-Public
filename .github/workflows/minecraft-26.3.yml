name: Minecraft 26.3 verification

on:
  push:
    branches: ["mc/26.3", "feature/mc26.3-animation-capabilities", "feature/mc26.3-sync-recovery-showcase", "feature/mc26.3-entity-layer-cues"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify Minecraft 26.3 and opt-in consumer
        run: bash gradlew -p versions/modern -Pminecraft_version=26.3 -Prunnable_examples=true --no-daemon --max-workers=2 build verifyRuntimeJar verifyRunnableExamples --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blendlib-26.3-verification
          path: |
            versions/modern/build/26.3/libs/*.jar
            versions/modern/build/26.3/reports/
            versions/modern/build/26.3/test-results/
          if-no-files-found: warn
