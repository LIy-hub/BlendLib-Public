name: Minecraft 26.3 verification

on:
  push:
    branches: ["mc/26.3", "feature/mc26.3-animation-capabilities", "feature/mc26.3-sync-recovery-showcase", "feature/mc26.3-entity-layer-cues", "feature/mc26.3-runtime-inspection", "feature/mc26.3-item-observation", "fix/mc26.3-item-animation-reload", "feat/mc26.3-weighted-procedural-pose", "feat/mc26.3-dynamic-layer-weights", "feat/mc26.3-layer-visual-events", "feat/mc26.3-material-appearance", "feat/mc26.3-nested-attachments", "feat/mc26.3-attachment-showcase", "feat/mc26.3-assembly-culling-envelope", "feat/mc26.3-item-material-appearance", "feat/mc26.3-item-visual-events", "feat/mc26.3-named-texture-skins", "feat/mc26.3-standard-two-bone-ik", "feat/mc26.3-locomotion-rules", "feat/mc26.3-blender-animation-authoring", "feat/mc26.3-blender-state-editor", "feat/mc26.3-blender-socket-editor", "feat/mc26.3-blender-rule-editor"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify Minecraft 26.3 and opt-in consumer
        run: bash gradlew -p versions/modern -Pminecraft_version=26.3 -Prunnable_examples=true --no-daemon --max-workers=2 build verifyRuntimeJar verifyRunnableExamples --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blendlib-26.3-verification
          path: |
            versions/modern/build/26.3/libs/*.jar
            versions/modern/build/26.3/reports/
            versions/modern/build/26.3/test-results/
          if-no-files-found: warn
